<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryReg - Kelola Anggota</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="image/logo.svg" alt="Logo" width="32" height="32" class="me-2">
        Perpustakaan Kampus
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#tentang">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#layanan">Layanan</a></li>
          <li class="nav-item"><a class="nav-link" href="anggota.html">Daftar Anggota</a></li>
          <li class="nav-item"><a class="nav-link" href="daftar.html">Pendaftaran</a></li>
          <li class="nav-item"><a class="nav-link active" href="kelola.html">Kelola Anggota</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="box">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Kelola Anggota</h2>
        <button id="tombolKeluar" class="btn btn-outline-danger btn-sm">Keluar</button>
      </div>

      <input type="text" id="cari" class="form-control mb-3" placeholder="Cari nama atau NIM/NIP...">

      <div id="notif" class="notif"></div>

      <div class="table-responsive">
        <table class="table table-striped mt-3">
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>NIM/NIP</th>
              <th>Jenis</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelAnggota"></tbody>
        </table>
      </div>
    </div>

    <div id="boxDetail" class="box" style="display: none">
      <h3>Detail Anggota</h3>
      <div id="isiDetail"></div>
      <button id="tutupDetail" class="btn btn-secondary btn-sm mt-2">Tutup</button>
    </div>

    <div id="boxEdit" class="box" style="display: none">
      <h3>Edit Anggota</h3>
      <form id="formEdit">
        <div class="mb-2">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" id="editNama" class="form-control">
        </div>
        <div class="mb-2">
          <label class="form-label">NIM / NIP</label>
          <input type="text" id="editNim" class="form-control">
        </div>
        <div class="mb-2">
          <label class="form-label">Program Studi</label>
          <input type="text" id="editProdi" class="form-control">
        </div>
        <div class="mb-2">
          <label class="form-label">Alamat</label>
          <textarea id="editAlamat" class="form-control" rows="2"></textarea>
        </div>
        <div class="mb-2">
          <label class="form-label">Nomor Telepon</label>
          <input type="text" id="editTelepon" class="form-control">
        </div>
        <div class="mb-2">
          <label class="form-label">Email</label>
          <input type="text" id="editEmail" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Jenis Keanggotaan</label>
          <select id="editJenis" class="form-select">
            <option value="">-- Pilih --</option>
            <option value="Mahasiswa">Mahasiswa</option>
            <option value="Dosen">Dosen</option>
            <option value="Tenaga Kependidikan">Tenaga Kependidikan</option>
          </select>
        </div>

        <ul id="editError" class="error"></ul>

        <button type="submit" class="btn btn-primary">Simpan</button>
        <button type="button" id="batalEdit" class="btn btn-secondary">Batal</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Perpustakaan Kampus - LibraryReg</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/kelola.js"></script>
</body>
</html>
