<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryReg - Pendaftaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="image/logo.svg" alt="Logo" width="32" height="32" class="me-2">
        Perpustakaan Kampus
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#tentang">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#layanan">Layanan</a></li>
          <li class="nav-item"><a class="nav-link" href="anggota.html">Daftar Anggota</a></li>
          <li class="nav-item"><a class="nav-link active" href="daftar.html">Pendaftaran</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login Petugas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container" style="max-width: 700px">
    <div class="box">
      <h2>Formulir Pendaftaran Anggota</h2>
      <p>Isi semua data di bawah ini.</p>

      <form id="formDaftar">
        <div class="mb-3">
          <label for="nama" class="form-label">Nama Lengkap</label>
          <input type="text" id="nama" class="form-control">
        </div>

        <div class="mb-3">
          <label for="nim" class="form-label">NIM / NIP</label>
          <input type="text" id="nim" class="form-control">
        </div>

        <div class="mb-3">
          <label for="prodi" class="form-label">Program Studi</label>
          <input type="text" id="prodi" class="form-control">
        </div>

        <div class="mb-3">
          <label for="alamat" class="form-label">Alamat</label>
          <textarea id="alamat" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
          <label for="telepon" class="form-label">Nomor Telepon</label>
          <input type="text" id="telepon" class="form-control">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" id="email" class="form-control">
        </div>

        <div class="mb-3">
          <label for="jenis" class="form-label">Jenis Keanggotaan</label>
          <select id="jenis" class="form-select">
            <option value="">-- Pilih --</option>
            <option value="Mahasiswa">Mahasiswa</option>
            <option value="Dosen">Dosen</option>
            <option value="Tenaga Kependidikan">Tenaga Kependidikan</option>
          </select>
        </div>

        <ul id="errorList" class="error"></ul>

        <button type="submit" class="btn btn-primary">Daftar</button>
      </form>

      <div id="notif" class="notif"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Perpustakaan Kampus - LibraryReg</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/daftar.js"></script>
</body>
</html>
