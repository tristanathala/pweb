<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryReg - Login Petugas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="image/logo.svg" alt="Logo" width="32" height="32" class="me-2">
        Perpustakaan Kampus
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#tentang">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#layanan">Layanan</a></li>
          <li class="nav-item"><a class="nav-link" href="anggota.html">Daftar Anggota</a></li>
          <li class="nav-item"><a class="nav-link" href="daftar.html">Pendaftaran</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login Petugas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="box login-box">
      <h2>Login Petugas</h2>
      <p class="text-muted mb-0">Default username : admin</p>
      <p class="text-muted">Default password : admin</p>

      <form id="formLogin">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <div id="notif" class="notif"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
