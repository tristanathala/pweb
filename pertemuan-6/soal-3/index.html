<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Registration and Validation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>REGISTRATION FORM</h1>
<div class="container">
  <form id="regForm" onsubmit="return validateForm()">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your full name">
    <span class="error" id="name-error"></span>

    <label for="address">Address</label>
    <input type="text" id="address" placeholder="Enter your address">
    <span class="error" id="address-error"></span>

    <label for="email">E-mail Address</label>
    <input type="text" id="email" placeholder="Enter your email">
    <span class="error" id="email-error"></span>

    <label for="password">Password</label>
    <input type="password" id="password">
    <span class="error" id="password-error"></span>

    <label for="subject">Select Your Course</label>
    <select id="subject">
      <option value="">Select Course</option>
      <option value="BTech">BTech</option>
      <option value="BBA">BBA</option>
      <option value="BCA">BCA</option>
      <option value="B.COM">B.COM</option>
    </select>
    <span class="error" id="subject-error"></span>

    <label for="college">College Name</label>
    <textarea id="college"></textarea>

    <div class="check">
      <input type="checkbox" id="agree"> <label for="agree" style="display:inline">I agree to the above information</label>
    </div>
    <span class="error" id="agree-error"></span>

    <button type="submit" class="btn">Send</button>
    <button type="reset" class="btn" onclick="resetErrors()">Reset</button>
  </form>
</div>

<hr>

<div class="container">
  <h2 style="text-align:center">Email Validation Form</h2>
  <label for="emailInput">Enter your email</label>
  <input type="text" id="emailInput" placeholder="example@domain.com">
  <button class="btn btn-green" onclick="validateEmail()">Submit</button>
  <p id="emailMsg"></p>
</div>

<script src="script.js"></script>
</body>
</html>
