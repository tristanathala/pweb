<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kode Pos Indonesia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">Kode Pos Indonesia</nav>

<div class="container">
  <div class="card">
    <p>Cari kode pos di wilayah Indonesia dengan memasukkan beberapa kata kunci pencarian di bawah ini.</p>

    <label for="provinsi">Provinsi</label>
    <select id="provinsi" onchange="fillKota()"></select>

    <label for="kota">Kota atau Kabupaten</label>
    <select id="kota"></select>

    <label for="keyword">Masukkan Kata Kunci Pencarian</label>
    <div class="search-bar">
      <div class="input-icon">
        <svg viewBox="0 0 512 512" width="16" height="16"><path fill="#333" d="M505 442.7L405.3 343c-4.5-4.5-10.6-7-17-7H372c27.6-35.3 44-79.7 44-128C416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c48.3 0 92.7-16.4 128-44v16.3c0 6.4 2.5 12.5 7 17l99.7 99.7c9.4 9.4 24.6 9.4 33.9 0l28.3-28.3c9.4-9.4 9.4-24.6.1-34zM208 336c-70.7 0-128-57.2-128-128 0-70.7 57.2-128 128-128 70.7 0 128 57.2 128 128 0 70.7-57.2 128-128 128z"/></svg>
        <input type="text" id="keyword" placeholder="Kelurahan, kecamatan, atau kode pos">
      </div>
      <button onclick="search()">Cari</button>
    </div>
  </div>

  <div id="output"></div>
</div>

<script src="script.js"></script>
</body>
</html>
